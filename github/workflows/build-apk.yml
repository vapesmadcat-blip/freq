name: Build APK

# Roda a cada push/PR na branch principal, e também pode ser disparado
# manualmente na aba "Actions" do GitHub (botão "Run workflow").
# Se você enviar uma tag no formato v*.*.* (ex: v1.0.0), ele também
# cria uma Release no GitHub com o APK anexado.
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # Este projeto não vem com o binário gradle-wrapper.jar (é um
      # arquivo compilado), então usamos o Gradle instalado pela action
      # acima diretamente, em vez de "./gradlew".
      - name: Compilar APK de debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Enviar APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Só roda quando você empurrar uma tag tipo v1.0.0 — cria uma
      # Release no GitHub com o APK pronto para baixar.
      - name: Criar Release com o APK (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
